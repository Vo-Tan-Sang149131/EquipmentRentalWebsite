name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  paths:
    uses: /.github/workflows/paths.yml

  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.backend == 'true' || needs.paths.outputs.root == 'true'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run backend tests
        run: ./mvnw clean verify -B

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: apps/backend/target/surefire-reports/
          retention-days: 1

  frontend:
    name: Frontend Build and Lint
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.frontend == 'true' || needs.paths.outputs.root == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --workspace=apps/frontend

      - name: Build frontend
        run: npm run build --workspace=apps/frontend

      - name: Upload frontend build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/dist/
          retention-days: 1

  integration:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    if: always()
    timeout-minutes: 10

    steps:
      - name: Download backend reports
        if: needs.backend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: backend-test-reports
          path: ./backend-test-reports

      - name: Download frontend build
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-build

      - name: Write summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.frontend.result }}" >> $GITHUB_STEP_SUMMARY
