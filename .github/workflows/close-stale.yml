name: Close Stale Tasks

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and Close Stale Items
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run stale action
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has not been updated for 30 days and will be closed automatically after 7 more days."
          days-before-stale: 30
          days-before-close: 7
          stale-pr-message: "This PR has not been updated for 14 days and will be closed automatically after 3 more days."
          days-before-pr-stale: 14
          days-before-pr-close: 3
