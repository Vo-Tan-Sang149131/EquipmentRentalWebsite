name: Security Scan

on:
  schedule:
    - cron: '0 0 * * *' # Automatically run at midnight UTC
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repo-scan:
    name: Scan Code & Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Ensure Java 21 is installed
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Activator cache Maven dependencies: ~/.m2/

      # Run this step to install the dependencies
      - name: Resolve Maven Dependencies
        run: mvn dependency:resolve -f apps/backend/pom.xml

      - name: Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps/backend'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
