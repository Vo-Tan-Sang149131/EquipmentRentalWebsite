spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: equipment-rental-backend

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email-address}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:equipment_rental_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - profile
              - email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:your-facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - public_profile
              - email
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v22.0/dialog/oauth
            token-uri: https://graph.facebook.com/v22.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /equipment_rental
    session:
      cookie:
        same-site: lax
        secure: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: false
    display-request-duration: true
    disable-swagger-default-url: false
    doc-expansion: list
  show-actuator: false
  api-docs.groups.enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

vnpay:
  enabled: true
  tmnCode: ${VNP_TMN_CODE:2QXUI4J4}
  hashSecret: ${VNP_HASH_SECRET:9A8B7C6D5E4F3A2B1C0D9E8F7A6B5C4D}
  payUrl: ${VNP_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  queryUrl: ${VNP_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  returnUrl: ${VNP_RETURN_URL:http://localhost:5173/checkout/vnpay-callback}
  ipnUrl: ${VNP_IPN_URL:https://empower-preflight-saffron.ngrok-free.dev/equipment_rental/api/payments/vnpay/ipn}
  version: 2.1.0
  command: pay
  currCode: VND
  locale: vn
  orderType: other
  expireMinutes: 60

momo:
  enabled: true
  partner-code: ${MOMO_PARTNER_CODE:your-partner-code}
  access-key: ${MOMO_ACCESS_KEY:your-access-key}
  secret-key: ${MOMO_SECRET_KEY:your-secret-key}
  api-url: ${MOMO_API_URL:https://test-payment.momo.vn/v2/gateway/api/create}
  return-url: ${MOMO_RETURN_URL:http://localhost:5173/checkout/momo-callback}
  ipn-url: ${MOMO_IPN_URL:https://your-public-domain.com/equipment_rental/api/payments/momo/ipn}
  request-type: captureWallet
  lang: vi

payment:
  bank-transfer:
    bank-name: ${BANK_NAME:Vietcombank}
    account-name: ${BANK_ACCOUNT_NAME:Your Name}
    account-number: ${BANK_ACCOUNT_NUMBER:0123456789}
    transfer-content-prefix: ${BANK_TRANSFER_PREFIX:RENT}
    manual-confirmation: true

app:
  jwt:
    secretKey: ${JWT_SECRET:MySecretKeyThatIsAtLeast32CharactersLongForHS256}
    accessTokenExpirationMs: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refreshTokenExpirationMs: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  crypto:
    secretKey: ${CRYPTO_SECRET:MyCryptoSecretKeyShouldBeDifferentFromJwtSecret}
    salt: ${CRYPTO_SALT:0123456789abcdef}

  flyway:
    auto-repair: ${APP_FLYWAY_AUTO_REPAIR:false}

  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    '[com.example]': ${APP_LOG_LEVEL:INFO}
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:INFO}
    org.springframework.web: ${SPRING_WEB_LOG_LEVEL:INFO}
    org.flywaydb: ${FLYWAY_LOG_LEVEL:INFO}
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

cloudinary:
  cloudName: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
  apiKey: ${CLOUDINARY_API_KEY:your-api-key}
  apiSecret: ${CLOUDINARY_API_SECRET:your-api-secret}
