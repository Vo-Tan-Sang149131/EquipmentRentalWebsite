spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  data:
    redis:
      host: localhost
      port: 63790

  flyway:
    locations: classpath:db/migration/schema,classpath:db/migration/data/test

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

app:
  oauth2:
    authorized-redirect-uri: http://localhost/oauth2/redirect
  redirect-uri: http://localhost
