server {
    listen 80;
    server_name localhost;

    # --- Cấu hình GZIP (Đã sửa dấu nháy ở gzip_disable) ---
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable 'MSIE [1-6]\.'; # Đã sửa thành nháy đơn
    # ------------------------------------------------------

    # Tắt access log toàn cục để tiết kiệm dung lượng đĩa và memory
    access_log off;

    # 1. Cấu hình cho Static Files (Xử lý lỗi 404 khi reload SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình Cache Browser cho tài nguyên tĩnh
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
    }

    # 2. Proxy cho API
    location /api/ {
        proxy_pass http://equipment-rental-backend:8080/equipment_rental/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        client_max_body_size 10m; # Cho phép upload file lên đến 10MB
    }

    # 3. Proxy cho Web Socket Chat
    location /ws-chat/ {
        proxy_pass http://equipment-rental-backend:8080/equipment_rental/ws-chat/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        # Bổ sung IP Header cho WebSocket để backend nhận diện được client
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeout 1 tiếng giúp giữ kết nối không bị ngắt đột ngột
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }
}
