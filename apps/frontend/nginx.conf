server {
    listen 80;
    server_name localhost;

    # --- GZIP configuration (quotes in gzip_disable fixed) ---
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable 'MSIE [1-6]\.'; # Changed to single quotes
    # ---------------------------------------------------------

    # Disable global access log to save disk space and memory
    access_log off;

    # 1. Configuration for Static Files (Handle 404 errors when reloading SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Configure Browser Cache for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
    }

    # 2. Proxy for API
    location /api/ {
        proxy_pass http://equipment-rental-backend:8080/equipment_rental/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        client_max_body_size 10m; # Allow file uploads up to 10MB
    }

    # 3. Proxy for WebSocket Chat
    location /ws-chat/ {
        proxy_pass http://equipment-rental-backend:8080/equipment_rental/ws-chat/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        # Add IP headers for WebSocket so backend can identify the client
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Set 1-hour timeout to keep connection alive without sudden drops
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }
}
