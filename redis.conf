################################## NETWORKING #################################

# Bind to localhost for security, or specify your private IP
# bind 127.0.0.1 -::1
bind 0.0.0.0

# Accept connections on the specified port
port 6379

# Close the connection after a client is idle for N seconds (0 to disable)
timeout 0

# TCP keepalive packets interval (in seconds)
tcp-keepalive 300

################################# GENERAL #####################################

# Run Redis as a daemon in the background (set to 'no' if using Docker/systemd)
daemonize no

# Specify the server log level (debug, verbose, notice, warning)
loglevel notice

# Log file path (leave empty for standard output/stdout)
logfile ""

# Set the number of databases (Default is 16)
databases 16

################################## SECURITY ###################################

# Require clients to issue AUTH <PASSWORD> before processing other commands
# Replace 'YourStrongPasswordHere' with a complex string
# requirepass YourStrongPasswordHere

# Disable or rename dangerous commands for security
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

########################### MEMORY MANAGEMENT ################################

# Limit the maximum memory used by the Redis server
# Examples: 2gb, 500mb
# maxmemory 2gb

# Policy to use when maxmemory is reached:
# volatile-lru -> Evict keys with an expire set using an LRU algorithm
# allkeys-lru -> Evict any key using an LRU algorithm
# noeviction -> Return errors when memory is full (Default)
maxmemory-policy allkeys-lru

############################# PERSISTENCE (RDB) ###############################

# Save the DB to disk on a schedule:
# save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

# Stop accepting writes if RDB snapshotting fails
stop-writes-on-bgsave-error yes

# Compress string objects when dumping to .rdb databases
rdbcompression yes

# The filename where to dump the DB
dbfilename dump.rdb

# The working directory where the DB file will be saved
dir /data

########################### PERSISTENCE (AOF) ################################

# Enable Append Only Mode (Highly recommended for data safety)
appendonly yes

# The name of the append-only file
appendfilename "appendonly.aof"

# How often to sync data to disk:
# always -> slow, safest
# everysec -> compromise (Default)
# no -> let the OS handle it
appendfsync everysec

# Block fsync during a background save to reduce disk I/O bottlenecks
no-appendfsync-on-rewrite no

# Automatic rewrite threshold percentage
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

############################### REPLICATION ###################################

# If this is a replica node, uncomment the line below to point to the master
# replicaof <masterip> <masterport>

# If the master is password protected, specify it here
# masterauth <master-password>

# Allow the replica to serve stale data if it loses connection to the master
replica-serve-stale-data yes

# Make the replica instance read-only
replica-read-only yes
